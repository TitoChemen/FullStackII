
server:
  port: 8084
  error:
    include-stacktrace: never
    include-message: always

spring:
  application:
    name: historial-service

  devtools:
    add-properties: false


  datasource:
    url: ${HISTORIAL_DB_URL:jdbc:mysql://localhost:3306/veterinaria_historial}
    username: ${HISTORIAL_DB_USER:vet_historial}
    password: ${HISTORIAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: veterinaria-san-marcos

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
