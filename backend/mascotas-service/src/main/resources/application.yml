server:
  port: 8082

spring:
  application:
    name: mascotas-service

  datasource:
    url: ${MASCOTAS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_mascotas}
    username: ${MASCOTAS_DB_USER:vet_mascotas}
    password: ${MASCOTAS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

app:
  jwt:
    issuer: veterinaria-san-marcos
    secret: ${JWT_SECRET}