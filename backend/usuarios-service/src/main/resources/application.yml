
server:
  port: 8081

spring:
  application:
    name: usuarios-service

  datasource:
    url: jdbc:mysql://localhost:3306/veterinaria_usuarios
    username: ${DB_USERNAME:vet_usuarios}
    password: ${DB_PASSWORD:vet_usuarios_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

app:
  jwt:
    issuer: veterinaria-san-marcos
    secret: ${JWT_SECRET}
